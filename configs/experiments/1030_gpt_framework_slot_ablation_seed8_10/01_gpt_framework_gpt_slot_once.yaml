schema_version: experiment-v2
experiment_name: gpt_framework_gpt_slot_once_seed8

java_materialization_mode: framework_slots
java_compiler_version: eagle-framework-slots-v1
candidate_java_mode: generated_phenotype
parent_evaluation_mode: reuse_cached
agent_template_path: eagle/java_templates/CandidateAgent.java

# The local model is not started for this treatment. The sole Gen-0 genome is
# selected by the direct GPT provider configured under framework.
model:
  name: qwen3_5_9b
  path: experiment_env/model/qwen3-5-9b-ud-q4-k-xl-q4-k-xl-bbcc0f54/model.gguf
  llama_server: experiment_env/model/llama.cpp/llama.cpp/build-eagle/bin/llama-server
  port: 18080
  context_size: 32768
  batch_size: 512
  additional_endpoints: []

seed_prompt_files: [seeds/worker_rush_policy.txt]
max_prompt_chars: 16000

runs: 1
random_seeds: [8]
# Generation 0 is the complete treatment; no offspring generation is created.
generations: 0
population_size: 1

execution_mode: openai
# Exactly one direct-GPT slot-selection request for this one-shot treatment.
initial_policy_max_attempts: 1
crossover_rate: 0.0
mutation_rate: 0.0

reflection_operator_mode: static
strategy_reflection_probability: 1.0
prompt_reflection_probability: 0.0
code_reflection_probability: 0.0

framework:
  bundle_path: configs/framework_bundles/gpt_finite_rule_market_v1/bundle.json
  bundle_version: eagle-framework-bundle-v1
  bundle_sha256: f674a580f0db088bd3436232d2dd36d071a231c9886f480a7aaed25669203e2b
  evolution_mode: local
  gpt_initial_candidates: 1
  model: gpt-6.1-sol

llm:
  temperature: 0.0
  match_commentator:
    enabled: false
    temperature: 0.0
  max_tokens: 8192

microrts_dir: third_party/microrts
match_timeout_seconds: 120
match_artifact_mode: compact
stagnation_generations: 0

evaluation:
  mode: self_play
  maps:
    - path: maps/8x8/basesWorkers8x8.xml
      tick_limit: 1500
    - path: maps/16x16/basesWorkers16x16.xml
      tick_limit: 3000
    - path: maps/24x24/basesWorkers24x24.xml
      tick_limit: 4000
  self_play_refresh_interval: 5
  self_play_opponent_library_capacity: 50
  self_play_pool_policy: tournament-v1
  semantic_probes:
    enabled: true
    fitness_tie_tolerance: 1.0
