[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eagle"
version = "0.1.0"
description = "Evolutionary Algorithm for Game-playing with LLM-Enabled Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.setuptools.packages.find]
include = ["eagle*", "generation*", "agents*", "evaluation*", "scripts*"]
