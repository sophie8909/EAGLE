schema_version: runtime-v1

conda_env: eagle

# Optional overrides; otherwise EAGLE resolves the active environment and PATH.
tools:
  python: null
  java: null
  javac: null

llm:
  model_name: qwen3.5-9b
  model_path: models/qwen3.5-9b.gguf
  server_binary: llama-server
  host: 127.0.0.1
  port: 8080
  context_size: 32768
  gpu_layers: -1
  parallel: 1
  threads: 8
  batch_size: 512
  startup_timeout_seconds: 180
  health_timeout_seconds: 5
  arguments: []

runtime:
  log_path: runtime/logs/llm-server.log
  pid_path: runtime/pids/llm-server.pid
